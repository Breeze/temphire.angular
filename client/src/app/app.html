@if (isLoggedIn()) {
  <header class="app-toolbar">
    <span class="app-toolbar__brand">
      <span class="app-toolbar__badge temphire-orb" aria-hidden="true">T<app-framework-mark /></span>
      TempHire
    </span>

    <nav class="app-toolbar__actions">
      @for (action of actions(); track action.label) {
        <button
          pButton
          type="button"
          class="app-toolbar__action"
          [disabled]="action.canExecute ? !action.canExecute() : false"
          [text]="true"
          (click)="action.execute()"
        >
          @if (action.icon; as icon) {
            <i [class]="icon"></i>
          }
          {{ action.label }}
        </button>
      }
    </nav>

    <span class="app-toolbar__spacer"></span>

    <!-- The signed-in user: opens the user menu (Usage, Logout). -->
    <button
      type="button"
      class="app-toolbar__user"
      aria-haspopup="menu"
      [attr.aria-expanded]="userMenuOpen()"
      aria-controls="user-menu"
      title="Your account"
      (click)="userMenu.toggle($event)"
    >
      <span class="app-toolbar__avatar" aria-hidden="true">{{ initial() }}</span>
      <span class="app-toolbar__who">
        <span class="app-toolbar__name">{{ username() }}</span>
        @if (tenantName()) {
          <span class="app-toolbar__company">{{ tenantName() }}</span>
        }
      </span>
      <i class="pi pi-chevron-down app-toolbar__caret" aria-hidden="true"></i>
    </button>
    <p-menu
      #userMenu
      id="user-menu"
      [model]="userMenuItems"
      [popup]="true"
      appendTo="body"
      styleClass="app-user-menu"
      (onShow)="userMenuOpen.set(true)"
      (onHide)="userMenuOpen.set(false)"
    />
  </header>
}

<main class="app-content">
  <router-outlet />
</main>

<p-toast position="top-right" />

<!-- Quinn, the assistant: only while signed in, so the conversation ends with the session. -->
@if (isLoggedIn()) {
  <app-quinn />
}
