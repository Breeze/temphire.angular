@if (isLoggedIn()) {
  <header class="app-toolbar">
    <span class="app-toolbar__brand">TempHire</span>

    @for (action of actions(); track action.label) {
      <button
        pButton
        type="button"
        [disabled]="action.canExecute ? !action.canExecute() : false"
        [text]="true"
        severity="contrast"
        (click)="action.execute()"
      >
        @if (action.icon; as icon) {
          <i [class]="icon"></i>
        }
        {{ action.label }}
      </button>
    }

    <span class="app-toolbar__spacer"></span>
    <span class="app-toolbar__user">{{ username() }}</span>
  </header>
}

<main class="app-content">
  <router-outlet />
</main>

<p-toast position="top-right" />
